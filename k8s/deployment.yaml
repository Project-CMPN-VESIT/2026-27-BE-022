apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneet-intellitender-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intellitender-frontend
  template:
    metadata:
      labels:
        app: intellitender-frontend
    spec:
      containers:
        - name: frontend
          image: moneet-intellitender-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: intellitender-frontend
spec:
  type: NodePort
  selector:
    app: intellitender-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneet-intellitender-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intellitender-backend
  template:
    metadata:
      labels:
        app: intellitender-backend
    spec:
      containers:
        - name: backend
          image: moneet-intellitender-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: intellitender-secrets
                  key: mongodb-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: intellitender-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: intellitender-backend
spec:
  type: ClusterIP
  selector:
    app: intellitender-backend
  ports:
    - port: 5000
      targetPort: 5000
